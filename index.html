<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>味蕾 · 菜单搜索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="eyebrow">OUR MENU</div>
      <h1>今日菜单</h1>
      <p class="tagline">在烟火气里，找到你今天最想吃的味道。</p>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索菜品、口味或食材">
        <button type="button" id="clearBtn" hidden aria-label="清空搜索">✕</button>
      </div>

      <nav class="chips" id="filters"></nav>
    </header>

    <main class="container">
      <div class="meta">
        <span id="resultCount">0</span> 道菜品
      </div>

      <section class="menu-grid" id="menuGrid"></section>

      <div class="empty" id="empty" hidden>
        <div class="empty-icon">🍽️</div>
        <h3>没有找到相关菜品</h3>
        <p>换个关键词或分类试试吧</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
