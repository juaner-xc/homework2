<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Search · 菜单搜索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="eyebrow">OUR MENU · 今日菜单</div>
      <h1>Menu <span>菜单</span></h1>
      <p class="tagline">Find the flavor you're craving today · 找到今天最想吃的那道菜</p>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search dishes · 搜索菜品、口味或食材">
        <button type="button" id="clearBtn" hidden aria-label="Clear search">✕</button>
      </div>

      <nav class="chips" id="filters"></nav>
    </header>

    <main class="container">
      <div class="meta">
        <span id="resultCount">0</span> dishes · 道菜品
      </div>

      <section class="menu-grid" id="menuGrid"></section>

      <!-- 详情页：点击菜品后在下方展开 -->
      <section class="detail" id="detailPanel" hidden>
        <button class="detail-close" id="detailClose" aria-label="Close detail">✕</button>
        <div class="detail-inner">
          <div class="detail-visual" id="detailVisual">
            <span id="detailEmoji"></span>
          </div>
          <div class="detail-body">
            <div class="detail-top">
              <span class="tag" id="detailCategory"></span>
              <span class="rating" id="detailRating"></span>
            </div>
            <h2 id="detailName"></h2>
            <p class="detail-sub" id="detailSub"></p>
            <p class="detail-desc" id="detailDesc"></p>

            <h3 class="detail-label">Ingredients · 主要食材</h3>
            <ul class="ingredients" id="detailIngredients"></ul>

            <div class="detail-actions">
              <span class="price" id="detailPrice"></span>
              <button class="fav-btn" id="detailFavBtn">
                <svg viewBox="0 0 24 24">
                  <path d="M12 21s-7.5-4.7-10-9.3C.4 8.5 2.4 4.5 6.2 4.5c2.2 0 3.6 1.2 4.6 2.8 1-1.6 2.4-2.8 4.6-2.8 3.8 0 5.8 4 4.2 7.2C17.1 16.3 12 21 12 21Z"/>
                </svg>
                <span id="detailFavText">Save to favorites · 收藏</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="empty" id="empty" hidden>
        <div class="empty-icon">🍽️</div>
        <h3>No dishes found · 没有找到相关菜品</h3>
        <p>Try another keyword or category · 换个关键词或分类试试</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
